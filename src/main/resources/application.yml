server:
  port: 8080
spring:
  datasource:
    url: jdbc:h2:file:./data/demo
    driverClassName: org.h2.Driver
    username: root
    password: pass
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      concurrency: 1
  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
      use-new-id-generator-mappings: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        trace: false
        web-allow-others: false
iyzipay:
  api-key: ${IYZIPAY_API_KEY}
  secret-key: ${IYZIPAY_SECRET_KEY}
  base-url: ${IYZIPAY_BASE_URL:https://sandbox-api.iyzipay.com}
