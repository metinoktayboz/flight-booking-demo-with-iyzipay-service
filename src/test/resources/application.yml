spring:
  datasource:
    url: jdbc:h2:file:./data/demo
    driverClassName: org.h2.Driver
    username: root
    password: pass
  kafka:
    listener:
      concurrency: 1
  jpa:
    show-sql: false
    spring.jpa.database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
      use-new-id-generator-mappings: false
iyzipay:
  api-key: ${IYZIPAY_API_KEY}
  secret-key: ${IYZIPAY_SECRET_KEY}
  base-url: ${IYZIPAY_BASE_URL:https://sandbox-api.iyzipay.com}
